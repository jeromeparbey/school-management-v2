version: '3.8'

services:
  # ============================================
  # BASE DE DONNÉES POSTGRESQL
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: school_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: school_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - school_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BACKEND NODE.JS
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/school_db
      JWT_SECRET: my_super_secret_jwt_key_123456789
      JWT_REFRESH_SECRET: my_super_refresh_secret_key_123456789
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
      - ./backend/bulletins:/app/bulletins
      - ./backend/recus:/app/recus
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school_network
    command: npm run dev

  # ============================================
  # FRONTEND REACT (VITE)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5001/api/v1
      VITE_SOCKET_URL: http://localhost:5001
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - school_network
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0 --port 5173

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:

# ============================================
# NETWORKS
# ============================================
networks:
  school_network:
    driver: bridge